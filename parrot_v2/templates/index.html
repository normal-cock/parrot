<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.88.1">
    <title>Parrot Web</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.1/examples/sticky-footer-navbar/">

    <link href="http://mstation.top:8000/static/bootstrap-5.1.3.min.css" rel="stylesheet">
    <script src="http://mstation.top:8000/static/bootstrap-5.1.3.bundle.min.js"></script>
    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                /* 背景色 */
                --bg-primary: #ffffff;
                /* 页面主背景 */
                --bg-secondary: #f5f7fa;
                /* 卡片/组件背景 */
                /* 文字色 */
                --text-primary: #1d2129;
                /* 主要文字 */
                --text-secondary: #666c78;
                /* 次要文字 */
                --text-link: #1890ff;
                /* 链接色 */
                /* 边框/分割线 */
                --border-color: #e5e7eb;
                /* 强调色（按钮/高亮） */
                --accent-color: #1890ff;
                /* 过渡动画（切换时平滑过渡） */
                --transition: all 0.3s ease;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #121212;
                --bg-secondary: #1e1e1e;
                --text-primary: #f5f7fa;
                --text-secondary: #b0b7c3;
                --text-link: #40a9ff;
                --border-color: #333842;
                --accent-color: #40a9ff;
            }
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            /* 切换时平滑过渡 */
            padding: 20px;
        }

        main>.container {
            padding: 60px 15px 0;
        }

        table {
            border-collapse: separate;
            border-spacing: 10px 15px;
            color: inherit;
        }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <div class="btn-group me-2" role="group" aria-label="First group">
        <button type="button" class="btn btn-link" onclick="window.location.href = `/{{ passport }}`">Home</button>
        <button type="button" class="btn btn-link" onclick="window.location.href = `/{{ passport }}/review-page`">Begin
            Review</button>
    </div>
    {{ pagination.info }}
    {{ pagination.links }}
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Create Time</th>
                <th>Item Name</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ loop.index + pagination.skip }}</td>
                <td>{{ item['create_time'] }}</td>
                <td><a href="{{ item['url'] }}">{{ item['item_name'] }}</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {{ pagination.links }}
</body>
